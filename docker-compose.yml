services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-docmgmt}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-docmgmtpass}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      MONGO_URI: mongodb://${MONGO_USER:-docmgmt}:${MONGO_PASS:-docmgmtpass}@mongodb:27017/?authSource=admin
      MONGO_DB: docmgmt
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=32 chars)}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required (base64, 32 bytes)}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      COOKIE_SECURE: "false"
      ALLOW_HTTP_ENDPOINTS: "true"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "8080:8080"

  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080/api/v1}
    ports:
      - "3001:3001"

  minio:
    image: minio/minio:latest
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minio12345}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  mongo_data:
  minio_data:
  qdrant_data:
